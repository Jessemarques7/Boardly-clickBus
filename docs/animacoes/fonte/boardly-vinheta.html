<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --purple: #6a1b9a;
        --purple-light: #8e24aa;
        --purple-dark: #4a148c;
        --purple-deep: #2e0a5c;
        --yellow: #ffcc00;
        --white: #ffffff;
        --font-display: "Montserrat", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--purple-dark);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 32% 38%, var(--purple-light) 0%, var(--purple) 38%, var(--purple-dark) 72%, var(--purple-deep) 100%);
      }
      #glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1100px;
        height: 1100px;
        margin: -550px 0 0 -550px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 62%);
      }
      #lockup {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 56px;
        padding: 120px 160px;
      }
      #mark {
        display: block;
        width: 330px;
        height: 424px;
        flex: none;
        overflow: visible;
      }
      #text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      #word {
        display: flex;
        overflow: hidden;
        font-size: 216px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.035em;
        color: var(--white);
        padding: 0.04em 0.04em 0.26em 0;
      }
      #word span {
        display: block;
      }
      #underline {
        width: 100%;
        height: 14px;
        margin-top: -18px;
        border-radius: 7px;
        background: var(--yellow);
      }
      #ripple-a,
      #ripple-b,
      #ripple-c {
        opacity: 0;
      }
      #tagline {
        margin-top: 34px;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 0.005em;
        color: var(--white);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-fps="60" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="5.5" data-track-index="0">
        <div id="bg"></div>
        <div id="glow"></div>
        <div id="lockup">
          <svg id="mark" viewBox="26 20 56 72" xmlns="http://www.w3.org/2000/svg" aria-label="Logo do Boardly">
            <ellipse id="ripple-a" cx="54" cy="82.5" rx="11" ry="3" fill="none" stroke="var(--yellow)" stroke-width="0.9" />
            <ellipse id="ripple-b" cx="54" cy="82.5" rx="11" ry="3" fill="none" stroke="var(--yellow)" stroke-width="0.9" />
            <ellipse id="ripple-c" cx="54" cy="82.5" rx="11" ry="3" fill="none" stroke="var(--yellow)" stroke-width="0.9" />
            <ellipse id="ground" cx="54" cy="82.5" rx="11" ry="3" fill="var(--yellow)" />
            <g id="pin">
              <path d="M54,82 L37.37,57.11 A20,20 0 1 1 70.63,57.11 Z" fill="var(--white)" stroke="var(--white)" stroke-width="2" stroke-linejoin="round" />
              <g id="bus">
                <rect x="46.5" y="53" width="3.6" height="4" rx="1" fill="var(--purple)" />
                <rect x="57.9" y="53" width="3.6" height="4" rx="1" fill="var(--purple)" />
                <rect x="44.5" y="35.5" width="19" height="19.5" rx="3.5" fill="var(--purple)" />
                <rect x="48" y="39.5" width="12" height="6.5" rx="1.6" fill="var(--white)" />
                <circle class="light" cx="48.6" cy="50.6" r="1.6" fill="var(--yellow)" />
                <circle class="light" cx="59.4" cy="50.6" r="1.6" fill="var(--yellow)" />
              </g>
            </g>
          </svg>
          <div id="text">
            <div id="word" data-layout-allow-overflow="true"><span>B</span><span>o</span><span>a</span><span>r</span><span>d</span><span>l</span><span>y</span></div>
            <div id="underline"></div>
            <div id="tagline">Do bilhete ao portão de embarque</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        const PIN_TIP = "54 82";
        const GROUND = "54 82.5";
        const LAND = 0.75;

        // A marca começa centralizada: desloca metade da largura do texto + espaço.
        const text = document.getElementById("text");
        const centerOffset = (text.offsetWidth + 56) / 2;

        tl.fromTo("#glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, 0);

        // Ponto amarelo no chão marca o destino.
        tl.fromTo("#ground", { scale: 0, svgOrigin: GROUND }, { scale: 1, svgOrigin: GROUND, duration: 0.45, ease: "back.out(2)" }, 0.05);

        // O pin cai esticado, amassa ao tocar o chão e volta com elasticidade.
        const DROP = 0.6;
        tl.fromTo(
          "#pin",
          { y: -90, autoAlpha: 0, scaleX: 0.93, scaleY: 1.12, svgOrigin: PIN_TIP },
          { y: 0, duration: DROP, ease: "power2.in" },
          LAND - DROP
        );
        tl.to("#pin", { autoAlpha: 1, duration: 0.14, ease: "none" }, LAND - DROP);
        tl.to("#pin", { scaleX: 1.14, scaleY: 0.82, svgOrigin: PIN_TIP, duration: 0.1, ease: "power2.out" }, LAND);
        tl.to("#pin", { scaleX: 1, scaleY: 1, svgOrigin: PIN_TIP, duration: 0.9, ease: "elastic.out(1, 0.45)" }, LAND + 0.1);

        // Ondas no chão no impacto.
        tl.to("#ground", { scale: 1.3, svgOrigin: GROUND, duration: 0.1, ease: "power2.out" }, LAND);
        tl.to("#ground", { scale: 1, svgOrigin: GROUND, duration: 0.6, ease: "elastic.out(1, 0.5)" }, LAND + 0.1);
        tl.fromTo("#ripple-a", { scale: 1, opacity: 0.95, svgOrigin: GROUND }, { scale: 3.4, opacity: 0, svgOrigin: GROUND, duration: 1.1, ease: "power2.out", immediateRender: false }, LAND);
        tl.fromTo("#ripple-b", { scale: 1, opacity: 0.8, svgOrigin: GROUND }, { scale: 2.6, opacity: 0, svgOrigin: GROUND, duration: 1.1, ease: "power2.out", immediateRender: false }, LAND + 0.2);

        // O ônibus aparece dentro do pin e pisca os faróis.
        tl.fromTo("#bus", { scale: 0, svgOrigin: "54 46" }, { scale: 1, svgOrigin: "54 46", duration: 0.6, ease: "back.out(2)" }, LAND + 0.15);
        tl.fromTo(".light", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.8, transformOrigin: "50% 50%", duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: 3 }, LAND + 0.6);

        // A marca abre espaço (ainda no fim do quique) e o nome sobe letra a letra.
        const REVEAL = 1.5;
        tl.fromTo("#mark", { x: centerOffset }, { x: 0, duration: 0.95, ease: "power3.inOut" }, REVEAL);
        tl.fromTo("#word span", { yPercent: 125 }, { yPercent: 0, duration: 0.85, ease: "power4.out", stagger: 0.055 }, REVEAL + 0.5);
        tl.fromTo("#underline", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.8, ease: "power3.out" }, REVEAL + 0.95);
        tl.fromTo("#tagline", { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out" }, REVEAL + 1.15);

        // No lockup nada fica parado: o pin flutua, a sombra acompanha e o chão pulsa.
        const IDLE = 3.1;
        const HALF = 0.6;
        [0, 1].forEach((i) => {
          const t = IDLE + i * HALF * 2;
          tl.to("#pin", { y: -2.4, duration: HALF, ease: "sine.inOut" }, t);
          tl.to("#pin", { y: 0, duration: HALF, ease: "sine.inOut" }, t + HALF);
          tl.to("#ground", { scale: 0.8, svgOrigin: GROUND, duration: HALF, ease: "sine.inOut" }, t);
          tl.to("#ground", { scale: 1, svgOrigin: GROUND, duration: HALF, ease: "sine.inOut" }, t + HALF);
        });
        tl.fromTo("#ripple-c", { scale: 1, opacity: 0.9, svgOrigin: GROUND }, { scale: 3, opacity: 0, svgOrigin: GROUND, duration: 1.2, ease: "power2.out", immediateRender: false }, IDLE + HALF * 2);
        tl.to("#glow", { scale: 1.1, duration: 3, ease: "sine.inOut" }, 2.5);

        window.__timelines["main"] = tl;
        tl.seek(0);
      });
    </script>
  </body>
</html>
